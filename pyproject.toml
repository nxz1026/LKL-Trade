[project]
name = "lkl-trade"
version = "0.1.0"
description = "LKL-Trade 自动交易端：连掘金仿真，JSON 通道执行与回报"
requires-python = ">=3.10"

[project.scripts]
lkl = "lkl.main:main"

[project.optional-dependencies]
# gmtrade 仅 cp<=310，需独立 venv（如 .venv-trade）；从源码运行亦可
trade = ["gmtrade==3.0.6"]
# Windows 托盘（可选）：pythonw scripts/lkl_tray.py
tray = ["pystray>=0.19", "pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lkl*", "dashboard*"]
namespaces = true