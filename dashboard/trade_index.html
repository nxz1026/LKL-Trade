<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>LKL 交易看板</title>
<style>
body{font-family:system-ui;margin:2rem;background:#f7f8fa;color:#222}
h1{font-size:1.3rem}h2{font-size:1rem;margin:1.3rem 0 .4rem}
#tabs{display:flex;gap:.4rem;border-bottom:2px solid #dde;margin-bottom:1rem}
.tab{padding:.45rem 1.1rem;cursor:pointer;border:1px solid #dde;border-bottom:none;border-radius:8px 8px 0 0;background:#eee}
.tab.on{background:#fff;font-weight:600;border-top:2px solid #2a6}
.screen{display:none}.screen.on{display:block}
.card{background:#fff;border:1px solid #e3e5e8;border-radius:8px;padding:.6rem 1rem;margin:.4rem 0}
table{border-collapse:collapse;width:100%}
td,th{border:1px solid #e3e5e8;padding:4px 8px;font-size:.9rem;text-align:left}
.ok{color:#0a7d2b}.bad{color:#c0392b}.mid{color:#b07d00}.sub{color:#666;font-size:.8rem;margin:.2rem 0}
.cash b{margin-right:1.2rem}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.8rem}
.pill.o{background:#e6f4ea;color:#0a7d2b}.pill.x{background:#fdeaea;color:#c0392b}.pill.m{background:#fdf3e3;color:#b07d00}
button{margin-right:.4rem;font-size:.8rem}
</style></head>
<body>
<h1>LKL 交易看板</h1>
<div id="banner" class="sub" style="font-size:.95rem;padding:.4rem .6rem;border:1px solid #e3e5e8;border-radius:6px;background:#fff;margin:.3rem 0">加载中…</div>
<div id="tabs">
  <div class="tab on" data-v="trade" onclick="show('trade')">股票交易</div>
  <div class="tab" data-v="sys" onclick="show('sys')">系统运行状态</div>
</div>
<p id="stat" class="sub">加载中…</p>
<button onclick="manual()" style="font-size:.8rem">手动刷新</button>

<section id="trade" class="screen on">
  <h2>账户</h2><div class="card" id="account">-</div>
  <h2>当日待执行（decisions）</h2><div class="card" id="decisions">-</div><div id="decmeta" class="sub">-</div>
  <h2>执行回报（results）</h2><div class="card" id="results">-</div>
  <h2>今日委托</h2>
  <div class="sub" id="ordermeta">-</div>
  <div class="card" id="orders">-</div>
  <h2>对账（四源一致）</h2><div class="card" id="recon">-</div>
  <h2>告警中心</h2><div class="card" id="alerts">-</div>
</section>

<section id="sys" class="screen">
  <h2>运行环境</h2><div class="card" id="env">-</div>
  <h2>运行前自检（doctor）</h2><div class="card" id="doctor">-</div>
  <h2>安全治理</h2><div class="card" id="govern">-</div>
  <h2>交换目录文件</h2><div class="card" id="files">-</div>
</section>

<script>
function $(id){return document.getElementById(id)}
const esc=s=>{if(s==null)return'';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};
function show(v){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===v));
  (v==='sys')?loadSys():load();
}
var _resultsData=[],_decisionsRows=[];
async function load(){
  const s=await (await fetch('/api/state')).json();
  _resultsData=s.results||[];
  _decisionsRows=(s.decisions&&s.decisions.rows)||[];
  renderAccount(s.account); renderDecisions(s.decisions);
  renderResults(_resultsData); renderOrders(s.orders);
  fetchRecon(); fetchAlerts(); fetchVersions(s.for_date);
}
async function loadSys(){
  const s=await (await fetch('/api/sys')).json();
  const hb=s.heartbeat||{};
  renderBanner(s,hb);
  const term=`<span class="pill ${s.terminal==='在线'?'o':'x'}">终端 ${esc(s.terminal)}</span> `+
    `<span class="pill ${s.account_ready?'o':'x'}">账户 ${s.account_ready?'已连':'未连接'}</span>`;
  $('env').innerHTML=`<div class="cash"><b>端点 ${esc(s.endpoint)}</b><b>${term}</b>`+
    `<b>${s.trading_day?'交易日':'非交易日'}</b><b>${esc(s.phase)}</b></div>`+
    `<div class="sub">下一可交易 ${esc(s.next_open||'休市/今日无')} · 下次拉取 ${esc(s.next_pull||'暂无')} · 进程脉冲 ${esc(hb.last_success||'—')}</div>`;
  renderGovern(s);
  const keys=['exists','size','mtime','today','schema','for_date','parse'];
  const th='<tr><th>文件</th>'+keys.map(k=>`<th>${esc(k)}</th>`).join('')+'</tr>';
  const rows=Object.entries(s.files).map(([n,f])=>{
    const ok=f.exists&&f.today&&f.parse==='ok';
    return `<tr><td>${esc(n)}</td><td class="${f.exists?'ok':'bad'}">${f.exists?'有':'缺'}</td>`+
      keys.slice(1).map(k=>{ if(k==='today')return `<td class="${ok?'ok':'mid'}">${esc(f.today?'今日':'陈旧')}</td>`;
        return `<td>${esc(f[k])}</td>`; }).join('')+'</tr>'; }).join('');
  $('files').innerHTML='<table>'+th+rows+'</table>';
}
var _countdownAt=null,_cdAlerted=false,_pullAt=null,_pullAlerted=false;
function renderBanner(s,hb){
  const el=$('banner'); if(!el)return;
  const gov=s.govern||{};
  const mode=s.auto_trade?'<span class="pill o">实盘·自动交易 ON</span>'
    :(gov.halt?'<span class="pill x">已紧急停止</span>':'<span class="pill m">演练/只读</span>');
  const alive=hb.stale!==true&&hb.last_success?'<span class="pill o">调度存活</span>':'<span class="pill x">调度疑似停止/无心跳</span>';
  const cred=s.creds_ok===false?'<span class="pill x">凭证缺失</span>':'';
  const term2=`<span class="pill ${s.terminal==='在线'?'o':'x'}">终端 ${esc(s.terminal)}</span>`;
  const bound=s.bound_account?`· 绑定账户 ${esc(s.bound_account)}`:'';
  const hasPull=!!s.next_pull;
  _countdownAt=s.next_open?Date.parse(s.next_open):null;
  _pullAt=hasPull?Date.parse(s.next_pull):null;
  el.innerHTML=`${mode} ${alive} ${cred} ${term2}${bound}`+
    ` <span id="opencd" class="pill m">-</span>`+
    (hasPull?` <span id="pullcd" class="pill o">-</span>`:'')+
    ` · 进程脉冲 ${esc(hb.last_success||'—')}`+` · 文件活动 ${esc(s.last_file_activity||'—')}`;
}
function cdTick(){
  const banner=document.getElementById('banner'); if(!banner)return;
  const el=$('opencd');
  const s=_countdownAt?Math.max(0,_countdownAt-Date.now()):null;
  if(s!=null&&!s){ if(el){el.textContent='已到开市时点';el.className='pill x';} }
  else{
    if(el){ el.textContent=(s!=null?`距开市 ${_f(s)}`:'距开市 -'); el.className='pill '+(s!=null&&s<=300000&&!_cdAlerted?(_cdAlerted=true,'x'):'m'); }
  }
  const pull=$('pullcd');
  const ps=_pullAt?Math.max(0,_pullAt-Date.now()):null;
  if(pull){
    if(ps!=null&&!ps){ pull.textContent='已到拉取时点'; pull.className='pill x'; }
    else{ pull.textContent=(ps!=null?`距拉取 ${_f(ps)}`:'距拉取 -'); pull.className='pill o'; }
  }
}
function _f(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return (h>0?h+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');
}
function renderGovern(s){
  const el=$('govern'); if(!el)return;
  const gov=s.govern||{};
  const badge=s.auto_trade
    ?'<span class="pill o">自动交易 ON·实盘</span>'
    :(gov.halt?'<span class="pill x">已紧急停止</span>':'<span class="pill m">演练/只读</span>');
  el.innerHTML=`<div class="cash"><b>${badge}</b><b>模式 ${esc(gov.mode)}</b>`+
    `<b>停止 ${gov.halt?'是':'否'}</b></div>`+
    `<div class="sub">原因: ${esc(gov.reason||'-')} · 更新 ${esc(gov.updated_at||'')} · 操作均二次确认并写入告警审计</div>`+
    `<button onclick="govAct('arm')">切实盘</button>`+
    `<button onclick="govAct('dry')">演练</button>`+
    `<button style="background:#c0392b;color:#fff" onclick="govAct('halt','人工紧急停止')">紧急停止</button>`+
    `<button onclick="govAct('resume')">解除</button>`+
    `<div id="riskbox" class="sub">风控上限加载中…</div>`;
  loadRiskLimits();
  renderDoctor();
}
var _doctorData=null;
async function renderDoctor(){
  const el=$('doctor'); if(!el)return;
  const d=_doctorData;
  let body;
  if(!d){ body='<p class="sub">逐项验证 python/gmtrade/凭据/终端/交换目录/决策样例（相当于 CLI lkl doctor）。</p>'; }
  else{
    const rows=d.checks.map(c=>`<tr><td>${esc(c.name)}</td><td class="${c.ok?'ok':'bad'}">${c.ok?'✓ 通过':'✗ 失败'}</td><td>${esc(c.why||'')}</td></tr>`).join('');
    const pass=d.checks.filter(c=>c.ok).length;
    body=`<div class="cash"><b class="${d.ok?'ok':'bad'}">${d.ok?'自检通过':'存在失败项'}</b><b>${pass}/${d.checks.length}</b></div>`+
      `<table><tr><th>项</th><th>结果</th><th>说明</th></tr>${rows}</table>`;
  }
  el.innerHTML=body+`<p><button onclick="runDoctor()">${d?'重新自检':'运行前自检'}</button><span class="sub" id="doctorout"></span></p>`;
}
async function runDoctor(){
  const out=$('doctorout'); if(out)out.textContent='自检中…';
  try{
    _doctorData=await (await fetch('/api/doctor')).json();
  }catch(e){
    const el=$('doctor'); if(el)el.innerHTML=`${bad('自检失败')}：${esc(String(e))}<p><button onclick="runDoctor()">重试</button></p>`;
    return;
  }
  renderDoctor();
}
var _dashToken=null;
async function dashToken(){
  if(!_dashToken){ try{ _dashToken=(await (await fetch('/api/token')).json()).token; }catch(e){} }
  return _dashToken;
}
async function govAct(a,r){
  const names={arm:'切实盘(armed)——之后策略决策将自动下单',dry:'演练(dry)模式',halt:'紧急停止',resume:'解除紧急停止'};
  let reason=r||'';
  if(a==='arm'||a==='halt'){
    reason=prompt(`原因（写入审计${a==='halt'?'，默认「人工紧急停止」':'，可留空'}）：`,r||(a==='halt'?'人工紧急停止':''));
    if(reason===null)return;
  }
  if(!confirm(`确认执行「${names[a]}」？\n原因：${reason||'(无)'}`))return;
  const t=await dashToken();
  let j={};
  try{
    const res=await fetch('/api/govern',{method:'POST',headers:{'Content-Type':'application/json','X-Dash-Token':t},body:JSON.stringify({action:a,reason:reason||''})});
    j=await res.json();
  }catch(e){ j={error:String(e)}; }
  if(j.error)alert('操作失败：'+j.error);
  loadSys();
}
async function loadRiskLimits(){
  try{
    const r=await (await fetch('/api/risk_limits')).json();
    const L=r.limits||{};
    const el=$('riskbox'); if(!el)return;
    el.innerHTML='风控上限：单笔 ≤ <input id="rl_qty" type="number" min="0" style="width:5em" value="'+esc(L.max_qty||0)+'"> 股'+
      ' · 当日下单 ≤ <input id="rl_ord" type="number" min="0" style="width:5em" value="'+esc(L.max_orders||0)+'"> 次'+
      ' · 操作 ≤ <input id="rl_codes" type="number" min="0" style="width:5em" value="'+esc(L.max_codes||0)+'"> 只'+
      ' <button onclick="saveRiskLimits()">保存风控上限</button>（0=不限）';
  }catch(e){}
}
async function saveRiskLimits(){
  const v=id=>{const x=document.getElementById('rl_'+id);return x?Number(x.value):0};
  const t=await dashToken();
  let j={};
  try{
    const res=await fetch('/api/risk_limits',{method:'POST',headers:{'Content-Type':'application/json','X-Dash-Token':t},
      body:JSON.stringify({limits:{max_qty:v('qty'),max_orders:v('ord'),max_codes:v('codes')}})});
    j=await res.json();
  }catch(e){ j={error:String(e)}; }
  if(j.error)alert('保存失败：'+j.error); else alert('风控上限已保存');
  loadSys();
}
function renderAccount(a){
  const el=$('account'); const t=new Date().toLocaleTimeString('zh-CN',{hour12:false});
  if(!a.ok){
    const note=a.note||'';
    const offline=/连接|离线|connect|refused|登录|credential|认证/i.test(note);
    el.innerHTML=`${bad(offline?'终端离线/未连接':'读取账户失败')}：${esc(note)}<div class="sub">更新 ${t}</div>`;
    return;
  }
  const c=a.cash||{};
  const ps=a.positions||[];
  const mv=ps.reduce((s,p)=>s+(p.volume||0)*(p.last_price||0),0);
  const pnl=ps.reduce((s,p)=>s+(p.fpnl||0),0);
  const cost=ps.reduce((s,p)=>s+(p.volume||0)*(p.cost||0),0);
  // 排序：市值降序（大仓在上），成本 vs 现价 vs 浮盈同列对照
  const sorted=ps.slice().sort((x,y)=>(y.volume||0)*(y.last_price||0)-(x.volume||0)*(x.last_price||0));
  const top=sorted.slice(0,3);
  el.innerHTML=`<div class="cash"><b>资产净值 ¥${num(c.nav)}</b><b>总资产 ¥${num(c.balance)}</b>`+
    `<b>可用 ¥${num(c.available)}</b><b>冻结 ¥${num(c.frozen)}</b></div>`+
    `<div class="cash"><b>持仓市值 ¥${num(mv)}</b><b>持仓成本 ¥${num(cost)}</b>`+
    `<b class="${pnl>=0?'ok':'bad'}">持仓浮盈 ¥${num(pnl)}</b><b>持仓 ${ps.length} 只</b></div>`+
    `<div class="sub">更新 ${t}`+
    (top.length?` · 前重仓：${top.map(p=>esc(p.symbol)+' ¥'+num((p.volume||0)*(p.last_price||0))).join(' / ')}`:'')+'</div>'+
    (sorted.length?`<table><tr><th>代码</th><th>数量</th><th>可用</th><th>成本</th><th>现价</th><th>市值</th><th>浮盈</th></tr>`
    +sorted.map(p=>`<tr><td>${esc(p.symbol)}</td><td>${num(p.volume)}</td><td>${num(p.available)}</td><td>${num(p.cost)}</td><td>${num(p.last_price)}</td><td>${num((p.volume||0)*(p.last_price||0))}</td><td class="${(p.fpnl||0)>=0?'ok':'bad'}">${num(p.fpnl)}</td></tr>`).join('')+'</table>'
    :'<p class="sub">暂无持仓</p>');
}
function renderDecisions(o){
  const el=$('decisions');
  if(!o||o.ok===false){ el.innerHTML=`${bad('校验失败')}：${esc(o&&o.note||'')}`; return; }
  const rows=o&&o.rows||[]; if(!rows.length){ el.innerHTML='<p class="sub">空</p>'; return; }
  el.innerHTML='<table><tr><th>方向</th><th>代码</th><th>数量</th><th>window</th><th>原因</th></tr>'
    +rows.map(r=>`<tr><td>${esc(r.action)}</td><td>${esc(r.code)}</td><td>${num(r.volume)}</td>`+
      `<td>${esc(r.buy_window)}</td><td>${esc(r.reason)}</td></tr>`).join('')+'</table>';
}
function renderResults(rows){
  const el=$('results'); if(!rows||!rows.length){ el.innerHTML='<p class="sub">空</p>'; return; }
  el.innerHTML='<table><tr><th>链</th><th>方向</th><th>代码</th><th>状态</th><th>成交</th><th>剩余</th><th>均价</th><th>委托号</th><th>情况</th></tr>'
    +rows.map((t,i)=>{
      const st=t.status_label||'未知';
      const cls=t.ok?'ok':(t.status==='REJECTED'||t.status==='NO_POSITION'?'bad':'mid');
      return `<tr><td><button onclick="toggleChain(${i},this)" title="决策→委托→成交">链</button></td>`+
        `<td>${esc(t.action)}</td><td>${esc(t.code)}</td><td class="${cls}">${esc(st)}</td>`+
        `<td>${num(t.shares)}</td><td>${num(t.remaining)}</td><td>${num(t.price)}</td>`+
        `<td>${esc(t.order_id)}</td><td>${esc(t.reason)}</td></tr>`;}).join('')+'</table>';
}
function toggleChain(i,btn){
  const tr=btn.closest('tr');
  let nxt=tr.nextElementSibling;
  if(nxt&&nxt.classList.contains('chainrow')){ nxt.remove(); return; }
  const t=_resultsData[i]||{};
  // 决策源：同 code+action 的当日决策（可多版本）
  const ds=_decisionsRows.filter(d=>d.code===t.code&&d.action===t.action);
  const dpart=ds.length
    ?ds.map(d=>`<tr class="chainrow"><td colspan="2" class="sub">决策</td><td colspan="7">${esc(d.action)} ${esc(d.code)} ${num(d.volume)} 股 · window=${esc(d.buy_window||'-')} · ${esc(d.reason||'-')}</td></tr>`).join('')
    :`<tr class="chainrow"><td colspan="2" class="sub">决策</td><td colspan="7" class="mid">无匹配当日决策（手动下单或历史投递）</td></tr>`;
  // 委托：order_id 对应终端委托状态
  const oid=String(t.order_id||'');
  const ord=(_ordersData&&_ordersData.rows||[]).find(o=>String(o.full_id||o.order_id||'')===oid);
  const opart=ord
    ?`<tr class="chainrow"><td colspan="2" class="sub">委托</td><td colspan="7">${esc(ord.side)} ${esc(ord.symbol)} ${num(ord.volume)} · 成交 ${num(ord.filled)} · ${esc(ord.status_label||ord.status)}</td></tr>`
    :`<tr class="chainrow"><td colspan="2" class="sub">委托</td><td colspan="7" class="mid">终端委托查询无此单（历史日或已清理）</td></tr>`;
  tr.insertAdjacentHTML('afterend',dpart+opart);
}
var _orderFilter='all';
function setOrderFilter(v){ _orderFilter=v; renderOrders(_ordersData||{ok:true,rows:[]}); }
function renderOrders(obj){
  _ordersData=obj;
  const el=$('orders');
  const meta=$('ordermeta');
  const rows=obj.rows||[];
  const offline=!obj.ok;
  // 空态与故障态明确区分：故障给原因横幅；空数据显示「暂无」
  if(offline&&!rows.length){ if(meta)meta.textContent=''; el.innerHTML=`${bad('委托查询失败')}：${esc(obj.note||'终端离线')}<p class="sub">（手动委托回捞快照也缺失——终端曾在线时自动回捞，稍后重试）</p>`; return; }
  if(!rows.length){ if(meta)meta.textContent=''; el.innerHTML='<p class="sub">今日暂无委托</p>'; return; }
  const srcCount={manual:0,decision:0};
  rows.forEach(o=>{ if(o.source==='manual')srcCount.manual++; else if(o.source==='decision')srcCount.decision++; });
  if(meta) meta.textContent=(offline?`${bad('终端离线')} · `:'')+`手动 ${srcCount.manual} · 自动 ${srcCount.decision} · 共 ${rows.length}`+(obj.source==='manifest'?'（回捞快照）':'');
  const filter=rows.filter(r=>_orderFilter==='all'||r.source===_orderFilter);
  const h='<select onchange="setOrderFilter(this.value)"><option value="all"'+( _orderFilter==='all'?' selected':'')+'>全部</option><option value="manual"'+( _orderFilter==='manual'?' selected':'')+'>手动</option><option value="decision"'+( _orderFilter==='decision'?' selected':'')+'>自动</option></select>';
  el.innerHTML=h+'<table><tr><th>来源</th><th>委托号</th><th>代码</th><th>方向</th><th>数量</th><th>价格</th><th>已成交</th><th>剩余</th><th>状态</th></tr>'
    +(filter.length?filter.map(o=>`<tr><td><span class="pill ${o.source==='manual'?'m':'o'}">${esc(o.source==='manual'?'手动':'自动')}</span></td>`
    +`<td title="${esc(o.full_id)}" class="sub">${esc(o.id)}</td><td>${esc(o.symbol)}</td><td>${esc(o.side)}</td><td>${num(o.volume)}</td>`
    +`<td>${o.price?num(o.price):'市价'}</td><td>${num(o.filled)}</td><td>${num(o.remaining)}</td><td>${esc(o.status_label||o.status)}</td></tr>`).join('')
    :'<tr><td colspan="9" class="sub">该来源暂无委托</td></tr>')+'</table>';
}
async function fetchVersions(d){
  try{ const v=await (await fetch('/api/versions?d='+d)).json();
    const a=await (await fetch('/api/archive?d='+d)).json();
    const el=$('decmeta'); if(!el)return;
    const cur=v.versions.filter(x=>x.active).length;
    el.textContent=`决策文件版本 ${v.versions.length} · 当前生效 ${cur} · 已归档 ${a.count}`;
  }catch(e){} }
async function fetchRecon(){
  try{ const r=await (await fetch('/api/recon')).json();
    const el=$('recon'); const s=r.summary||{};
    el.innerHTML=`<div class="cash"><b>一致 ${s.ok||0}</b><b class="bad">异常 ${s.warn||0}</b><b>共 ${s.total||0}</b></div>`+
      (r.error?`<div class="sub bad">${esc(r.error)}</div>`:'');
    if(!(r.rows&&r.rows.length)){ el.innerHTML+='<p class="sub">空</p>'; return; }
    el.innerHTML+='<table><tr><th>方向</th><th>代码</th><th>状态</th><th>情况</th></tr>'
      +r.rows.map(R=>`<tr><td>${esc(R.action)}</td><td>${esc(R.code)}</td><td class="${R.level==='ok'?'ok':'bad'}">${esc(R.status)}</td><td>${esc(R.note)}</td></tr>`).join('')+'</table>';
  }catch(e){}
}
async function fetchAlerts(){
  try{ const r=await (await fetch('/api/alerts')).json(); const s=r.summary||{};
    const el=$('alerts');
    el.innerHTML=`<div class="cash"><b class="${s.crit?'bad':''}">CRIT ${s.crit||0}</b><b>WARN ${s.warn||0}</b><b>共 ${s.total||0}</b></div>`;
    if(!r.recs||!r.recs.length){ el.innerHTML+='<div class="sub">无告警</div>'; return; }
    el.innerHTML+='<table><tr><th>级别</th><th>时间</th><th>消息</th></tr>'
      +r.recs.slice(-15).reverse().map(a=>`<tr><td class="${a.level==='CRIT'?'bad':(a.level==='WARN'?'mid':'ok')}">${esc(a.level)}</td><td>${esc(a.ts)}</td><td>${esc(a.msg)}</td></tr>`).join('')+'</table>';
  }catch(e){}
}
const num=x=>x==null||x===''?'—':Number(x).toFixed(2);
const bad=a=>'<span class="bad">'+esc(a)+'</span>';
var _timer=null;
function tick(){
  load(); loadSys();
  clearTimeout(_timer);
  fetch('/api/meta').then(r=>r.json()).then(m=>{
    var badge=document.getElementById('stat');
    badge.textContent=(m.window?'文件读写窗口活跃 · 每'+m.refresh+'s 自动刷新'
        :'非读写时段 · 自动刷新已暂停(点手动刷新)');
    if(m.refresh>0){ _timer=setTimeout(tick, m.refresh*1000); }
  }).catch(()=>{});
}
function manual(){ tick(); }
setInterval(cdTick,1000);
tick();
</script>
